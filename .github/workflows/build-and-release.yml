name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test test/EA_Adverts.Tests.csproj

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/__RELEASE_VERSION__/${GITHUB_REF_NAME#v}/" src/AdvertsPlugin.cs

      - name: Build
        run: dotnet publish EA_Adverts.csproj --configuration Release --output ./publish/EA_Adverts

      # The 5stack registry installs the zip as a plugin folder, so it holds EA_Adverts/ at the root
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd publish
          zip -r ../EA_Adverts-${{ github.ref_name }}.zip EA_Adverts

      - name: Keep release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: EA_Adverts-${{ github.ref_name }}.zip

  # Only this job can write, and only for a tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch release archive
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: EA_Adverts-${{ github.ref_name }}.zip
          generate_release_notes: true
